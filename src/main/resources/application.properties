# Nama Aplikasi
spring.application.name=backend

# Konfigurasi Database (XAMPP MySQL)
# Pastikan database 'neurogine_db' sudah dibuat di phpMyAdmin
spring.datasource.url=jdbc:mysql://localhost:3306/neurogine_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Konfigurasi JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Dialek untuk MySQL (Hibernate 6+ biasanya otomatis, tapi ini untuk memastikan)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Server Port
server.port=8080